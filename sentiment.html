<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美诺 MENOW 舆情监控专题 · 美诺彩妆情报资讯台</title>
<style>
:root{
  --brand:#1565C0; --brand-dark:#0D47A1; --brand-light:#E3F2FD;
  --card-bg:#fff; --bg:#F4F6F9; --text:#1f2d3d; --text2:#5a6b7b;
  --border:#e6ebf1; --radius:16px; --radius-sm:10px;
  --shadow:0 4px 18px rgba(20,50,90,.07); --shadow-hover:0 8px 28px rgba(20,50,90,.12);
  --pos:#2E7D32; --neu:#607D8B; --ln:#EF6C00; --hr:#C62828; --senti:#7B1FA2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--brand);text-decoration:none}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:12px 24px;background:linear-gradient(135deg,#7B1FA2,#9C27B0);color:#fff;box-shadow:0 2px 12px rgba(123,31,162,.3)}
.topbar .tb-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.topbar .tb-title span{opacity:.85;font-weight:400}
.topbar .back{padding:7px 16px;border-radius:20px;background:rgba(255,255,255,.18);color:#fff;font-weight:600;font-size:13px}
.topbar .back:hover{background:rgba(255,255,255,.3);color:#fff}
.cover-note{margin:14px 24px 0;padding:0;border-radius:10px;background:#F3E5F5;color:#6A1B9A;font-size:13px;border:1px solid #E1BEE7;overflow:hidden}
.cover-note .cn-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 16px;cursor:pointer;user-select:none}
.cover-note .cn-head .cn-toggle{font-size:12px;color:#8E24AA;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.cover-note .cn-head .cn-toggle .caret{transition:transform .2s;display:inline-block}
.cover-note .cn-body{padding:0 16px 10px;line-height:1.7}
.cover-note.collapsed .cn-body{display:none}
.cover-note.collapsed .cn-head .cn-toggle .caret{transform:rotate(-90deg)}
/* 2026-08-22 v23 全局置顶平台筛选器（sticky 副栏，随页面下拉常驻，联动全板块） */
.filter-bar{position:sticky;top:54px;z-index:49;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 24px;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 2px 8px rgba(20,50,90,.05)}
.filter-bar .fb-label{font-size:12px;color:var(--text2);margin-right:4px;font-weight:600}
.global-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s}
.global-btn:hover{border-color:var(--brand);color:var(--brand)}
.global-btn.active{background:var(--senti);border-color:var(--senti);color:#fff;font-weight:600}
/* 日期选择器 */
.tb-date-nav{position:relative;display:flex;align-items:center;gap:8px;margin-left:auto;margin-right:0}
.tb-date-nav .tb-dnav-btn{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:background .2s}
.tb-date-nav .tb-dnav-btn:hover{background:rgba(255,255,255,.28)}
.tb-date-nav .tb-dnav-btn.tb-dnav-latest{background:rgba(255,255,255,.22)}
.tb-date-nav .tb-dnav-current{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:14px;background:rgba(255,255,255,.22);color:#fff;font-size:13px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.35);transition:background .2s}
.tb-date-nav .tb-dnav-current:hover{background:rgba(255,255,255,.32)}
.tb-date-nav .tb-dnav-hint{font-size:11px;color:rgba(255,255,255,.75);margin-left:4px}
.cal-popup{position:absolute;z-index:80;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-hover);padding:14px;width:300px;display:none}
.cal-popup.show{display:block}
.cal-popup .cp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-popup .cp-title{font-size:14px;font-weight:700;color:var(--text)}
.cal-popup .cp-nav button{border:1px solid var(--border);background:#fff;border-radius:8px;width:26px;height:26px;cursor:pointer;color:var(--text2)}
.cal-popup .cp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--text2);margin-bottom:4px}
.cal-popup .cp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-popup .cp-day{height:30px;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:8px;cursor:pointer;color:var(--text)}
.cal-popup .cp-day:hover{background:var(--brand-light)}
.cal-popup .cp-day.cp-other{color:#c5cdd6}
.cal-popup .cp-day.cp-today{font-weight:800;color:var(--brand)}
.cal-popup .cp-day.cp-has{background:#F3E5F5;color:var(--senti);font-weight:700}
.cal-popup .cp-day.cp-cur{background:var(--senti);color:#fff}
.cal-popup .cp-foot{margin-top:8px;font-size:11px;color:var(--text2);text-align:center}
.wrap{max-width:1180px;margin:0 auto;padding:18px 24px 60px}
.module{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:24px;overflow:hidden;border:1px solid var(--border)}
.mod-header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 12px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,var(--brand-light) 0%,#fff 100%)}
.mod-header h2{font-size:17px;font-weight:700;color:var(--brand);display:flex;align-items:center;gap:8px}
.mod-header h2 .icon{font-size:20px}
.mod-note{margin:0 0 14px;padding:0;background:none;border:none;color:var(--text2);font-size:12px;line-height:1.7}
.mod-note b{color:var(--brand)}
.mod-body{padding:18px 22px 22px}
/* 2026-08-22 v23 舆情速览 5 矮卡：标签右上角、数字+查看明细在左、去冗余文案、inset 色条 */
.plat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.plat-card{position:relative;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:10px 12px;min-height:84px;cursor:pointer;transition:box-shadow .15s;text-align:left;box-shadow:inset 4px 0 0 var(--accent,#7B1FA2);overflow:hidden}
.plat-card:hover{box-shadow:inset 4px 0 0 var(--accent,#7B1FA2),var(--shadow-hover)}
.plat-card .pill{position:absolute;top:8px;right:10px;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:11px;color:#fff}
.plat-card .pill .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.9)}
.plat-card .pill.high_risk{background:var(--hr)}.plat-card .pill.light_negative{background:var(--ln)}
.plat-card .pill.neutral{background:var(--neu)}.plat-card .pill.positive{background:var(--pos)}.plat-card .pill.excluded{background:var(--brand)}.plat-card .pill.doubt{background:var(--senti)}
.plat-card .num{font-size:26px;font-weight:700;line-height:1.2;margin-top:18px;color:var(--accent,#7B1FA2)}
.plat-card .hint{font-size:12px;color:var(--text2);margin-top:4px}
.plat-note{font-size:12px;color:var(--text2);margin-top:10px}
.plat-ditem{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.plat-ditem:last-child{border-bottom:none}
.plat-ditem .d-title{font-size:13px;font-weight:600;line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.plat-ditem .d-meta{font-size:12px;color:var(--text2);margin-top:3px}
/* 2026-08-25 来源类型角标：WebSearch聚合(电商/媒体补充) vs 登录态一手 */
.rf-src-tag{font-size:11px;line-height:1;padding:2px 7px;border-radius:9px;font-weight:600;vertical-align:middle;white-space:nowrap}
.rf-src-tag.wsb{background:rgba(194,107,168,.16);color:#C26BA8;border:1px solid rgba(194,107,168,.35)}
.rf-src-tag.login{background:rgba(224,123,166,.14);color:#E07BA6;border:1px solid rgba(224,123,166,.3)}
/* 图表区：三图横向等宽 */
.charts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:860px){.charts{grid-template-columns:1fr}}
.chart-box{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;overflow:visible}
.chart-box h4{font-size:13px;color:var(--text2);margin-bottom:8px;font-weight:600}
.chart-box svg{display:block;max-height:160px;height:auto;overflow:visible}
.donut{width:100%;max-width:170px;height:auto;margin:6px auto;position:relative;overflow:visible}
.donut-legend{font-size:12px;margin-top:8px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px}
.donut-legend span{display:inline-flex;align-items:center;gap:4px}
.donut-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.chart-box{overflow:visible}
.chart-box svg{overflow:visible}
.chart-box .donut svg{overflow:visible}
.pbar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px}
.pbar .pname{width:64px;color:var(--text2);flex-shrink:0}
.pbar .ptrack{flex:1;height:14px;background:#eef1f5;border-radius:7px;overflow:hidden;position:relative}
.pbar .pfill{height:100%;border-radius:7px;transition:width .4s;display:block}
.pbar .pcnt{width:34px;text-align:right;color:var(--text2);flex-shrink:0;font-weight:700}
/* 风险清单 v23.2：标签右上 / 达人昵称首行 / 标题2行 / 信息行(发布时间·点赞❤️·平台) / 仅查看详情 */
.risk-flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:stretch}
.risk-flow-card{position:relative;border:1px solid var(--border);border-radius:12px;padding:12px 14px 12px 16px;background:var(--card-bg);overflow:hidden;display:flex;flex-direction:column;min-height:150px;cursor:pointer;box-shadow:inset 4px 0 0 var(--accent,#C62828);transition:box-shadow .15s}
.risk-flow-card:hover{box-shadow:inset 4px 0 0 var(--accent,#C62828),var(--shadow-hover)}
.risk-flow-card .rf-badge{position:absolute;top:10px;right:12px;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:11px;color:#fff}
.risk-flow-card .rf-badge .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.92)}
.risk-flow-card .rf-badge.high_risk{background:var(--hr)}.risk-flow-card .rf-badge.light_negative{background:var(--ln)}
.risk-flow-card .rf-badge.neutral{background:var(--neu)}.risk-flow-card .rf-badge.positive{background:var(--pos)}
.risk-flow-card .rf-author{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--text);padding-right:64px;line-height:1.4;min-height:22px}
.risk-flow-card .rf-author .rf-author-logo{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex-shrink:0;overflow:hidden}
.risk-flow-card .rf-author .rf-author-logo svg{width:18px;height:18px;display:block;overflow:visible}
.risk-flow-card .rf-author .rf-author-logo .rf-card-logo{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;overflow:hidden}
.risk-flow-card .rf-author .rf-author-logo .rf-card-logo svg{width:18px!important;height:18px!important;display:block}
.risk-flow-card .rf-author .rf-author-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.risk-flow-card .rf-title{font-size:13px;line-height:1.5;color:var(--text);margin-top:5px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:39px}
.risk-flow-card .rf-info{display:flex;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--text2);margin-top:7px;gap:0}
.risk-flow-card .rf-info span{margin:0 4px;font-size:12px;color:var(--text2);font-weight:400}
.risk-flow-card .rf-info span:first-child{margin-left:0}
.risk-flow-card .rf-info .rf-sep{color:var(--text2);font-weight:400;font-size:14px}
.risk-flow-card .rf-info .rf-like{color:var(--text2);font-weight:400;display:inline-flex;align-items:center;gap:2px}
.risk-flow-card .rf-info .rf-like-heart{font-size:13px;color:#E0245E;line-height:1}
.risk-flow-card .rf-info .rf-like-num{color:var(--text2);font-weight:400;font-size:12px}
/* 抽屉 / 速览明细中 infoLine 出来的样式：❤️ 红、数字与分隔符统一 */
.rf-like{display:inline-flex;align-items:center;gap:2px;color:var(--text2);font-size:12px;font-weight:400}
.rf-like-heart{font-size:13px;color:#E0245E;line-height:1}
.rf-like-num{color:var(--text2);font-weight:400}
/* 2026-08-25 增强：互动四连 chip / 正文预览 / 热度条 / 抽屉排序 */
.rf-chip{display:inline-flex;align-items:center;gap:3px;background:transparent;color:var(--text2);font-size:12px;font-weight:500;margin-right:10px;white-space:nowrap}
.rf-chip-ic{font-size:12px;line-height:1}
.rf-body{margin-top:7px;font-size:12px;line-height:1.55;color:var(--text2);background:var(--brand-light);border-left:3px solid var(--brand);border-radius:4px;padding:6px 9px;max-height:68px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;cursor:pointer}
.rf-body.expanded{max-height:none;-webkit-line-clamp:unset;display:block;overflow:visible}
.rf-body-card{margin-top:6px;max-height:42px;-webkit-line-clamp:2}
.drawer-sort{margin-left:10px;font-size:11px;border:1px solid var(--border);background:var(--bg);color:var(--text2);border-radius:12px;padding:2px 10px;cursor:pointer}
.drawer-sort:hover{color:var(--brand-dark);border-color:var(--brand)}
.risk-flow-card .rf-view{font-size:12px;font-weight:700;color:var(--brand);margin-top:6px;align-self:flex-start;text-decoration:none}
/* AI 整体语义研判标签（Hy3 在场裁决 / 本地四层兜底） */
.risk-flow-card .rf-ai{margin-top:8px;font-size:12px;color:var(--brand);font-weight:500;background:rgba(123,31,162,.06);border-left:3px solid #7B1FA2;border-radius:6px;padding:6px 8px;line-height:1.5}
.drawer-body .rf-ai{margin-top:8px;font-size:12px;color:var(--brand);font-weight:500;background:rgba(123,31,162,.06);border-left:3px solid #7B1FA2;border-radius:6px;padding:6px 8px;line-height:1.5}
.risk-flow-card .rf-ai .ai-label{color:var(--text2);font-weight:400}
.risk-flow-card .rf-ai .ai-reason{color:var(--text2);font-weight:400;margin-left:4px}
.ai-tag{display:inline-block;padding:1px 6px;border-radius:6px;font-size:11px;font-weight:600;margin-left:4px;vertical-align:middle;white-space:nowrap}
.ai-tag.ai-hy3{background:#7B1FA2;color:#fff}
.ai-tag.ai-local{background:rgba(96,125,139,.14);color:#607D8B}
.risk-flow-card .rf-view:hover{text-decoration:underline}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
.pager button{border:1px solid var(--border);background:#fff;border-radius:18px;padding:5px 16px;font-size:13px;cursor:pointer;color:var(--text2)}
.pager button:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager .pg-info{font-size:12px;color:var(--text2)}
.empty{color:var(--text2);font-size:13px;padding:10px 0;text-align:center}
.dw-wrap{display:flex;flex-wrap:wrap;gap:8px}
.dw{font-size:13px;font-weight:600;padding:5px 12px;border-radius:14px;display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.dw .dw-word{line-height:1.2}
.dw .dw-pf{font-size:10px;font-weight:400;color:#fff;background:rgba(0,0,0,.22);border-radius:8px;padding:1px 7px}
.dw.neg{background:#FFEBEE;color:var(--hr);border:1px solid #FFCDD2}
.dw.ok{background:#E8F5E9;color:var(--pos);border:1px solid #C8E6C9}
.dw.comp{border-style:dashed;border-color:#B0BEC5}
.dw .dw-tag{font-size:9px;font-weight:600;color:#607D8B;background:#ECEFF1;border-radius:7px;padding:1px 6px;margin-top:2px}
.sugg li{margin:6px 0 6px 18px;font-size:14px}
.foot{text-align:center;color:var(--text2);font-size:12px;padding:20px;line-height:1.8}
/* 抽屉 */
.mask{position:fixed;inset:0;background:rgba(20,40,70,.45);opacity:0;visibility:hidden;transition:.25s;z-index:90}
.mask.show{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:#fff;box-shadow:-8px 0 30px rgba(20,50,90,.25);transform:translateX(105%);transition:transform .28s;z-index:100;display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.drawer-head .d-title{font-size:16px;font-weight:700;flex:1}
.drawer-close{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:15px;color:var(--text2)}
.drawer-body{flex:1;overflow-y:auto;padding:14px 20px 30px}
.drawer-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.drawer-item .d-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:5px;align-items:center}
.drawer-item .d-text{color:var(--text)}
.drawer-item a{font-size:11px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:3px;margin-top:6px;color:var(--brand)}
.drawer-item a:hover{text-decoration:underline}
.risk-disposal{font-size:13px;color:var(--text2);background:#F8F9FB;border-radius:8px;padding:8px 10px;margin-top:6px}
.risk-disposal b{color:var(--brand)}
/* 平台 SVG logo（去背景色块，直接贴图；尺寸受外层容器控制） */
.plat-logo{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.plat-logo svg{display:block;width:100%;height:100%}
.drawer-logo{width:22px;height:22px;margin-right:8px;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.drawer-logo svg{width:22px!important;height:22px!important;display:block}
/* ─── V23 移动端精修（仅窄屏生效，PC 端不受影响） ─── */
@media(max-width:560px){
  .topbar { padding:10px 12px; gap:8px; }
  .topbar .tb-title { font-size:16px; }
  .topbar .tb-title span { display:none; }
  .tb-date-nav { margin-left:auto; gap:6px; }
  .tb-date-nav .tb-dnav-btn { display:none; }
  .tb-date-nav .tb-dnav-current { padding:5px 10px; font-size:12px; }
  .filter-bar { padding:8px 12px; top:50px; }
  .cal-popup { left:auto; right:0; width:auto; max-width:92vw; }
  .wrap { padding:12px 12px 50px; }
  .mod-header { padding:13px 14px 9px; }
  .mod-header h2 { font-size:16px; }
  .mod-body { padding:13px 14px 18px; }
  .plat-grid { grid-template-columns:repeat(2,1fr); gap:8px; }
  .risk-flow { grid-template-columns:1fr; }
  .drawer { width:auto; max-width:92vw; }
  img { max-width:100%; height:auto; }
}
@media(max-width:380px){
  .topbar { padding:8px 10px; gap:6px; }
  .topbar .tb-title { font-size:15px; }
  .tb-date-nav .tb-dnav-current { padding:5px 8px; font-size:11px; }
  .wrap { padding:10px 8px 44px; }
  .mod-header { padding:12px 10px 8px; }
  .mod-body { padding:12px 10px 16px; }
  .plat-grid { gap:7px; }
}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-title">🛡️ 美诺 <span>MENOW 舆情监控专题</span></div>
  <div class="tb-date-nav">
    <button class="tb-dnav-btn" onclick="prevDay()" title="前一天">‹ 前一天</button>
    <button class="tb-dnav-btn" onclick="gotoDefault()" title="今天">今天</button>
    <button class="tb-dnav-btn" onclick="nextDay()" title="后一天">后一天 ›</button>
    <div class="tb-dnav-current" onclick="toggleCal(event)" title="打开日期选择窗口">
      <span class="tb-dnav-icon">📅</span>

function platMatch(plat, raw){
  const g = platOf(raw);
  if(plat==='全部') return true;
  return g===plat;
}
function normalizeLv(lv){
  // 2026-08-23 防御性映射：把非标准情感标签归到 5 档，避免统计分项之和不等于 total
  const m={
    'high_risk':'high_risk','高危':'high_risk',
    'light_negative':'light_negative','轻危':'light_negative','negative':'light_negative',
    'neutral':'neutral','中性':'neutral',
    'positive':'positive','正面':'positive',
    'doubt':'doubt','存疑':'doubt'
  };
  return m[lv] || 'neutral';
}
function buildUnifiedPool(D, plat){
  // 2026-08-23 修复：舆情速览/趋势/情感/平台分布四板块统一统计口径。
  // 统计对象 = risks + hot_topics 去重后，剔除 excluded（同名干扰/官方账号不计入声量）。
  // 不包含 dropdown_words（微博下拉词/搜索建议不是真实舆情条目，不混入声量统计）。
  const rows=[];
  const seenKeys=new Set();
  function keyOf(url, title, plat, author, dt){
    const u=(url||'').trim();
    if(u) return 'url::'+u;
    return 'txt::'+(plat||'')+'|'+(author||'')+'|'+(dt||'')+'|'+(title||'').slice(0,60);
  }
  (D.risks||[]).filter(r=>(r.brand||'美诺')==='美诺').forEach(r=>{
    if(!platMatch(plat, r.platform)) return;
    const k=keyOf(r.source_url, r.text||r.title, platOf(r.platform), r.account, r.date||r.event_date);
    if(seenKeys.has(k)) return;
    const lv=normalizeLv(r.level||'neutral');
    if(lv==='excluded') return;
    seenKeys.add(k);
    // 2026-08-24 修复：按「入库日/监测日 monitor_date」做分日筛选与统计，
    // publish_date 只作为展示字段，不参与按日期过滤，避免「今天抓到但昨天发布」的内容被漏掉。
    const pubDate = r.monitor_date || r.event_date || r.date || '';
    rows.push({date:pubDate, lv:lv, plat:platOf(r.platform),
               title:r.text||r.title||'', author:r.account||'', likes:r.likes||'', url:r.source_url||'',
               publish_date:r.publish_date || '',
               comments:r.comments||'', collects:r.collects||'', shares:r.shares||'', body:r.body||(r.text||'')});
  });
  (D.hot_topics||[]).filter(t=>(t.brand||'美诺')==='美诺').forEach(t=>{
    if(!platMatch(plat, t.platform)) return;
    const k=keyOf(t.source_url, t.topic||t.title||t.text, platOf(t.platform), t.account, t.time||t.date||t.event_date);
    if(seenKeys.has(k)) return;
    const lv=normalizeLv(t.sentiment_level||'neutral');
    if(lv==='excluded') return;
    // 跨池 URL 去重交由上方 seenKeys.has(k) 统一处理（risks 池已占 url::xxx 时此处自动跳过），
    // 不再做「负面不重复」的二次过滤，避免误删话题池里的独立真实条目。
    seenKeys.add(k);
    // 2026-08-24 修复：统计/筛选维度用 monitor_date（入库日），publish_date 仅展示。
    const pubDateT = t.monitor_date || t.event_date || t.time || t.date || '';
    rows.push({date:pubDateT, lv:lv, plat:platOf(t.platform),
               title:t.title||t.topic||t.text||'', author:t.account||'', likes:t.likes||t.volume||'', url:t.source_url||'',
               publish_date:t.publish_date || '',
               comments:t.comments||t.comment_count||'', collects:t.collects||'', shares:t.shares||'', body:t.body||(t.topic||t.text||'')});
  });
  return rows;
}
function computeTrend(D, plat){
  const byDate = {};
  buildUnifiedPool(D, plat).forEach(function(x){
    const ev = x.date; if(!ev) return;
    byDate[ev] = (byDate[ev]||0) + 1;
  });
  const dates = Object.keys(byDate).sort();
  return dates.map(function(d){ return {date:d, count:byDate[d]}; });
}
function computeDist(D, plat, ev){
  const rows = buildUnifiedPool(D, plat).filter(x=>!ev||x.date===ev);
  const c = {high_risk:0, light_negative:0, neutral:0, positive:0, doubt:0};
  rows.forEach(function(x){ const lv=normalizeLv(x.lv); c[lv]=(c[lv]||0)+1; });
  return {
    high_risk: c.high_risk,
    light_negative: c.light_negative,
    neutral: c.neutral,
    positive: c.positive,
    doubt: c.doubt,
    total: rows.length
  };
}
function computePlatDist(D, plat, ev){
  const allRows = buildUnifiedPool(D, '全部').filter(x=>!ev||x.date===ev);
  if(plat!=='全部'){
    return [{platform:plat, count:allRows.filter(x=>x.plat===plat).length}];
  }
  const byP={};
  allRows.forEach(function(x){ byP[x.plat]=(byP[x.plat]||0)+1; });
  const order=['抖音','小红书','微博','电商','其他'];
  return order.filter(p=>byP[p]).map(p=>({platform:p, count:byP[p]}));
}
function buildCharts(D, ev){
  const plat = window.__CUR_PLAT||'全部';
  ev = ev || (D.meta&&D.meta.overview_default_date) || CUR_DATE;
  const trend = computeTrend(D, plat);

  let trendSvg='<div class="empty">该平台采样天数不足</div>';
  if(trend.length>=2){
    const W=560,H=140,pad=22;const max=Math.max.apply(null, trend.map(t=>t.count).concat([1]));
    const pts=trend.map((t,i)=>{const x=pad+i*(W-2*pad)/(trend.length-1);const y=H-pad-(t.count/max)*(H-2*pad);return [x,y];});
    const evIdx = trend.findIndex(t=>t.date===ev);
    const evMark = evIdx>=0 ? `<circle cx="${pts[evIdx][0].toFixed(1)}" cy="${pts[evIdx][1].toFixed(1)}" r="6" fill="none" stroke="#C62828" stroke-width="2"/><circle cx="${pts[evIdx][0].toFixed(1)}" cy="${pts[evIdx][1].toFixed(1)}" r="3" fill="#C62828"/>` : '';
    trendSvg=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="140" preserveAspectRatio="xMidYMid meet" style="display:block;overflow:visible"><polyline fill="none" stroke="#7B1FA2" stroke-width="2.5" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`+
      trend.map((t,i)=>`<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="3" fill="#7B1FA2"/><text x="${pts[i][0].toFixed(1)}" y="${H-6}" font-size="9" fill="#607D8B" text-anchor="middle">${esc(t.date.slice(5))}</text><text x="${pts[i][0].toFixed(1)}" y="${(pts[i][1]-7).toFixed(1)}" font-size="9" fill="#7B1FA2" text-anchor="middle">${t.count}</text>`).join('')+evMark+
      `</svg>`;
  }
  // 环形分母统一为去重后的当日声量总数（不含 excluded/dropdown_words），与舆情速览/趋势/平台分布一致。
  const tot=(dist&&dist.total)||0;
  const R=52, CX=60, CY=60, SW=20, C=2*Math.PI*R;
  let acc=0;const arcs=[];
  if(tot>0){
    [['high_risk','#C62828'],['light_negative','#EF6C00'],['neutral','#607D8B'],['positive','#2E7D32']].forEach(([k,c])=>{
      const v=dist[k]||0;const frac=v/tot;
      if(frac>0){ const len=frac*C; const off=acc*C; acc+=frac;
        const mid=acc-frac/2; const ang=mid*2*Math.PI- Math.PI/2;
        const tx=(CX+ (R)*Math.cos(ang)).toFixed(1), ty=(CY+(R)*Math.sin(ang)).toFixed(1);
        arcs.push(`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${c}" stroke-width="${SW}" stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 ${CX} ${CY})"/><text x="${tx}" y="${ty}" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">${v}</text>`);
      }
    });
  }
  const donut=tot>0
    ? `<div style="max-width:170px;margin:4px auto"><svg viewBox="0 0 120 120" width="100%" height="auto" style="display:block;overflow:visible">${arcs.join('')}<text x="60" y="60" font-size="11" fill="#607D8B" text-anchor="middle" dominant-baseline="central">共 ${tot}</text></svg></div>`
    : '<div class="empty" style="height:120px;display:flex;align-items:center;justify-content:center">当日无数据</div>';
  const legend=`<div class="donut-legend" style="text-align:center;justify-content:center">`+[['high_risk','高危'],['light_negative','轻危'],['neutral','中性'],['positive','正面']].map(([k,t])=>`<span><i style="background:${LEVEL_COLOR[k]}"></i>${t}</span>`).join('')+`</div>`+
    ((dist.doubt||0)>0?'<div style="font-size:11px;color:var(--text2);text-align:center;margin-top:4px">存疑 '+dist.doubt+' 条（未计入分布）</div>':'');
  const pdist=computePlatDist(D, plat, ev);
  const pmax=Math.max.apply(null, pdist.map(p=>p.count).concat([1]));
  const bars=pdist.map(function(p){
    const pct=(p.count/pmax*100); const color=(typeof PLATFORM_COLORS!=='undefined'&&PLATFORM_COLORS[p.platform])||'#7B1FA2';
    return '<div class="pbar"><span class="pname">'+p.platform+'</span><span class="ptrack"><span class="pfill" style="width:'+pct.toFixed(0)+'%;background:'+color+'"></span></span><span class="pcnt">'+p.count+'</span></div>';
  }).join('')||'<div class="empty">暂无平台分布数据</div>';
  const scopeNote = plat==='全部' ? '当日声量统计不含同名干扰/官方账号等排除项，与舆情速览卡片一致' : ('当前平台：'+plat+'（按平台过滤后真实采集量）');
  const dayTotal = tot;
  return `<section class="module"><div class="mod-header"><h2><span class="icon">📈</span> 声量趋势与分布</h2></div>
   <div class="mod-body">${modNote(scopeNote)}
   <div class="charts">
     <div class="chart-box"><h4>近7日采集声量趋势</h4>${trendSvg}<div style="font-size:11px;color:var(--text2);margin-top:6px;text-align:center">当前选中：<b style="color:#C62828">${esc(ev)}</b> · 当日共 <b style="color:#C62828">${dayTotal}</b> 条</div></div>
     <div class="chart-box"><h4>情感分布</h4>${donut}${legend}</div>
     <div class="chart-box"><h4>平台分布</h4>${bars}</div>
   </div></div></section>`;
}

function getExcludedByDate(D, ev, plat){
  // 2026-08-23 修复：排除归因随顶部平台筛选器联动，只汇总当前平台的 collection_stats。
  // 2026-08-23 二次修复：必须按当前选中日期 ev 取 collection_stats_by_date[ev]，
  // 而非 D.meta.collection_stats（后者恒为 latest 文件，导致切换日期排除卡不变）。
  plat = plat || window.__CUR_PLAT || '全部';
  const byDate = (D.meta&&D.meta.collection_stats_by_date)||{};
  const cs = byDate[ev] || (D.meta&&D.meta.collection_stats) || {};
  let total=0; const reasons={};
  Object.keys(cs).forEach(function(p){

    const rb=s.excluded_by_reason||{};

  });
  return {total:total, reasons:reasons};
}
function buildPlatSection(D, ev){

function buildRisks(risks, ev, page){
  page=page||1;
  // 2026-08-23 用户纠偏：风险清单不再随顶部平台筛选器联动，始终展示当日全部美诺风险，避免"卡片有高危但清单为空"。
  const filtered = risks;
  const seen={}; const uniq=[];
  filtered.forEach(function(r){
    const u=r.source_url||('hash::'+r.platform+'|'+r.text);
    if(!seen[u]){ seen[u]=1; uniq.push(r); }
  });
  const sorted=[...uniq].sort((a,b)=>((a.level==='high_risk')?-1:1)-((b.level==='high_risk')?-1:1));
  window.__riskAll=sorted;
  const PER=6;
  const totalPages=Math.max(1, Math.ceil(sorted.length/PER));
  if(page>totalPages) page=totalPages;
  const pageItems=sorted.slice((page-1)*PER, page*PER);
  const items=pageItems.map(r=>{
    const lvl=r.level||'light_negative';
    const likes=r.likes||'—';
    const plat=r.source||platOf(r.platform);
    const dt=r.publish_date||r.date||r.event_date||ev||'—';
    const url=r.source_url||'';
    const platIcon = plat||'其他';
    const viewLink = url ? ('<a class="rf-view" href="'+esc(url)+'" target="_blank" onclick="event.stopPropagation()">🔗 查看详情</a>') : '<div class="rf-view">🔗 查看详情</div>';
    const aiReason = r.ai_reason||'';
    const aiLine = aiReason ? ('<div class="rf-ai"><span class="ai-label">AI 语义研判</span><span class="ai-reason">（'+esc(aiReason)+'）</span></div>') : '';
    const pubTxt = String(dt).startsWith('编辑于') ? esc(dt) : ('发布于 '+esc(dt));
    const riskChips=interactionChips(r.likes||'0', r.comments||'', r.collects||'', r.shares||'');
    const riskBody=(r.text||'')?('<div class="rf-body rf-body-card">'+esc(String(r.text||'').slice(0,80))+'</div>'):'';
    const srcTag=(r.source_type==='websearch_baseline'?' <span class="rf-sep">·</span> <span class="rf-src-tag wsb">WebSearch聚合</span>':(r.from==='login_crawl'?' <span class="rf-sep">·</span> <span class="rf-src-tag login">登录态一手</span>':''));
    return '<div class="risk-flow-card" style="--accent:'+ (LEVEL_COLOR[lvl]||'#C62828') +'" onclick="openRiskDrawer(\''+esc(url)+'\')">'+
      '<span class="rf-badge '+lvl+'"><span class="dot"></span>'+(LEVEL_LABEL[lvl]||lvl)+'</span>'+
      '<div class="rf-author"><span class="rf-author-logo">'+platLogo(platIcon).replace('plat-logo','plat-logo rf-card-logo')+'</span><span class="rf-author-name">@'+(r.account?esc(r.account):'未知')+'</span></div>'+
      '<div class="rf-title">'+esc(r.text||'')+'</div>'+
      '<div class="rf-info">'+riskChips+' <span class="rf-sep">·</span><span>'+esc(plat)+'</span><span class="rf-sep">·</span>'+pubTxt+srcTag+'</div>'+
      riskBody+
      aiLine+
      viewLink+
      '</div>';
  }).join('')||'<div class="empty">'+ev+' 该平台未检出美诺风险舆情 🎉</div>';
  const pager = sorted.length>PER
    ? '<div class="pager"><button onclick="riskGo('+(page-1)+')" '+(page<=1?'disabled':'')+'>‹ 上一页</button>'+
      '<span class="pg-info">第 '+page+' / '+totalPages+' 页（共 '+sorted.length+' 条）</span>'+
      '<button onclick="riskGo('+(page+1)+')" '+(page>=totalPages?'disabled':'')+'>下一页 ›</button></div>'
    : '';
  return '<section class="module"><div class="mod-header"><h2><span class="icon">⚠️</span> 风险舆情清单</h2></div>'+
   '<div class="mod-body"><div class="risk-flow">'+items+'</div>'+pager+'</div></section>';
}
function contentId(url){
  if(!url) return url;
  const base=(url.split('?')[0]||'').split('#')[0];
  let m=base.match(/xiaohongshu\.com\/(?:explore|discovery\/item)\/([a-zA-Z0-9]+)/);
  if(m) return 'xhs:'+m[1];
  m=base.match(/douyin\.com\/(?:video|note)\/([a-zA-Z0-9]+)/);
  if(m) return 'dy:'+m[1];
  m=base.match(/weibo\.com\/\d+\/([a-zA-Z0-9]+)/);
  if(m) return 'wb:'+m[1];
  return base;
}
function mergeRiskPool(risks, topics){
  // 2026-08-23 修复：把 hot_topics 中 sentiment_level 为 high_risk/light_negative 的条目也纳入风险清单，与抽屉数据源对齐。
  // 2026-08-23 修复2：用内容ID去重（忽略xsec_token），避免同条笔记跨监测日被重复展示。
  const out = (risks||[]).slice();
  const seen = new Set(out.map(r => contentId(r.source_url) + '|' + (r.event_date || '')));
  (topics||[]).forEach(function(t){
    const lv = t.sentiment_level || '';
    if (lv !== 'high_risk' && lv !== 'light_negative') return;
    const key = contentId(t.source_url) + '|' + (t.event_date || '');
    if (seen.has(key)) return;
    seen.add(key);
    out.push({
      text: t.topic || t.title || t.text || '', source: t.platform || t.source, account: t.account,
      date: t.publish_date || t.time || t.date || t.event_date,
      publish_date: t.publish_date || t.time || t.date || t.event_date,
      source_url: t.source_url, level: lv, brand: t.brand || '美诺',
      event_date: t.event_date, platform: t.platform, likes: t.volume || '0',
      ai_sentiment: t.ai_sentiment, ai_reason: t.ai_reason, used_hy3: t.used_hy3
    });
  });
  return out;
}
function riskGo(p){ window.__riskPage=p; const D=SENTIMENT_DATA; const ev=CUR_DATE; const risks=pick(D.risks, ev).filter(r=>(r.brand||'美诺')==='美诺'); const topics=pick(D.hot_topics, ev).filter(t=>(t.brand||'美诺')==='美诺'); const sec=[...document.querySelectorAll('.module')].find(m=>m.querySelector('.risk-flow')); if(!sec) return; const node=document.createElement('div'); node.innerHTML=buildRisks(mergeRiskPool(risks, topics), ev, p); sec.replaceWith(node.firstElementChild); }
function buildEndorse(arr){
  const rows=arr.length?arr.map(r=>`<div class="list-row"><span class="lv" style="background:${LEVEL_COLOR[r.sentiment]||'#607D8B'}">${LEVEL_LABEL[r.sentiment]||esc(r.sentiment||'')}</span><span><b>${esc(r.name)}</b> ｜ ${esc(r.note||'')}</span></div>`).join(''):'<div class="empty">暂无代言人舆情监测</div>';
  return `<section class="module"><div class="mod-header"><h2><span class="icon">🌟</span> 明星 / 代言人舆情</h2></div><div class="mod-body">${rows}</div></section>`;
}
/* 防控建议参考：按当前日期 ev 动态生成（基于当日美诺风险清单 + 平台分布） */
function buildSuggestions(D, ev){
  const risks=(D.risks||[]).filter(r=>(r.brand||'美诺')==='美诺' && r.event_date===ev);
  const hr=risks.filter(r=>r.level==='high_risk');
  const ln=risks.filter(r=>r.level==='light_negative');
  const out=[];
  const platCount={};
  risks.forEach(r=>{const p=r.source||platOf(r.platform);platCount[p]=(platCount[p]||0)+1;});
  const topPlat=Object.keys(platCount).sort((a,b)=>platCount[b]-platCount[a])[0]||'—';
  if(hr.length){
    out.push('今日检出高危舆情 '+hr.length+' 条（集中平台：'+topPlat+'），建议立即核实来源真实性并准备统一回应口径，必要时联动法务/客服。');
  }
  if(ln.length){
    out.push('轻危舆情 '+ln.length+' 条（主要平台：'+topPlat+'），建议主动投放正向内容（种草/使用教程）对冲负面联想，防止发酵。');
  }
  if(!hr.length && !ln.length){
    out.push('今日未检出美诺相关风险舆情，维持常规监测节奏即可。');
  } else {
    const tops=(D.hot_topics||[]).filter(t=>(t.brand||'美诺')==='美诺'&&t.event_date===ev);
    if(tops.length) out.push('同期热度话题 '+tops.length+' 条，可借势做正向内容卡位（如开学季/军训场景）。');
  }
  return out;
}

/* 平台识别 */
function platOf(raw){
  const r=String(raw||'').trim();
  if(!r) return '其他';
  if(['抖音','小红书','微博'].indexOf(r)>=0) return r;
  if(r.indexOf('京东')>=0||r.indexOf('天猫')>=0||r.indexOf('淘宝')>=0||r.indexOf('拼多多')>=0||r.indexOf('生活服务')>=0) return '电商';
  return '其他';
}

function platLogo(plat, cls){
  const svg=PLAT_SVG[plat]||PLAT_SVG['其他'];
  return '<span class="plat-logo '+cls+'" title="'+esc(plat)+'">'+svg+'</span>';
}
/* —— 互动四连 chip / 正文预览 / 热度条 / 抽屉排序（2026-08-25 增强） —— */
function toNum(v){ const n=parseInt(String(v==null?'':v).replace(/[^\d]/g,''),10); return isNaN(n)?0:n; }
function pubLabel(dt){ if(!dt) return '—'; return String(dt).startsWith('编辑于')?esc(dt):('发布于 '+esc(dt)); }
function interactionChips(likes, comments, collects, shares){
  const c=v=>(v===''||v==null)?'—':v;
  return '<span class="rf-chip"><span class="rf-chip-ic" style="color:#E0245E">❤</span>'+c(likes)+'</span>'+
         '<span class="rf-chip"><span class="rf-chip-ic">💬</span>'+c(comments)+'</span>'+
         '<span class="rf-chip"><span class="rf-chip-ic">⭐</span>'+c(collects)+'</span>'+
         '<span class="rf-chip"><span class="rf-chip-ic">⇄</span>'+c(shares)+'</span>';
}
function drawerItemHTML(it){
  const p=it.plat||it.platform||it.source||'其他';
  const link=it.url?('<a class="rf-view" href="'+esc(it.url)+'" target="_blank" onclick="event.stopPropagation()">🔗 查看详情</a>'):sourceLink(it);
  const aiReason=it.ai_reason||'';
  const aiLine=aiReason?('<div class="rf-ai"><span class="ai-label">AI 语义研判</span><span class="ai-reason">（'+esc(aiReason)+'）</span></div>'):'';
  const body=it.body?('<div class="rf-body" onclick="toggleBody(this)">'+esc(it.body)+'</div>'):'';
  return `<div class="plat-ditem">${platLogo(p,'drawer-logo')}
    <div style="flex:1;min-width:0">
      <div class="d-title">${esc(it.title||it.text||'')}</div>
      <div class="d-meta">${esc(it.author||it.account||'—')} <span class="rf-sep">·</span> ${esc(p)} <span class="rf-sep">·</span> ${pubLabel(it.publish_date||it.date)}</div>
      ${body}
      <div class="d-chips" style="margin-top:6px">${interactionChips(it.likes||it.volume, it.comments, it.collects, it.shares)}</div>
      ${aiLine}
      <div style="margin-top:6px">${link}</div>
    </div></div>`;
}
window.__drawerSort='likes';
window.__curDrawer=null;
window.__curDrawerRows=[];
function sortDrawerRows(rows){
  const arr=[...rows];
  if(window.__drawerSort==='likes'){
    arr.sort((a,b)=>toNum(b.likes)-toNum(a.likes));
  } else {
    arr.sort((a,b)=>String(b.publish_date||b.date||'').localeCompare(String(a.publish_date||a.date||'')));
  }
  return arr;
}
function toggleBody(el){ el.classList.toggle('expanded'); }
function toggleDrawerSort(){
  window.__drawerSort=(window.__drawerSort==='likes')?'time':'likes';
  const c=window.__curDrawer; if(!c) return;
  if(c.kind==='plat') openPlatDrawer(c.plat,c.lv);
  else if(c.kind==='level') openDrawer(c.lv);
}
function infoLine(likes, comments, collects, shares, account, plat, dt, item){
  const chips=interactionChips(likes, comments, collects, shares);
  const acc=account?('@'+esc(account)):'';
  let srcTag='';
  const st=(item&&(item.source_type||item.from))||'';
  if(st==='websearch_baseline'){
    srcTag=' <span class="rf-sep">·</span> <span class="rf-src-tag wsb">WebSearch聚合</span>';
  } else if(st==='login_crawl'){
    srcTag=' <span class="rf-sep">·</span> <span class="rf-src-tag login">登录态一手</span>';
  }
  return chips+' <span class="rf-sep">·</span> '+acc+' <span class="rf-sep">·</span> '+esc(plat||'—')+' <span class="rf-sep">·</span> '+pubLabel(dt)+srcTag;
}
function openPlatDrawer(plat, lv){
  window.__curDrawer={kind:'plat', plat:plat, lv:lv};
  let rows=(window.__platRows||[]).filter(r=>(plat==='全部'||r.plat===plat)&&r.lv===lv);
  rows=sortDrawerRows(rows);
  window.__curDrawerRows=rows;
  const LVL={high_risk:'高危',light_negative:'轻危',neutral:'中性',positive:'正面',doubt:'存疑',excluded:'排除'};
  const sortLabel=window.__drawerSort==='likes'?'点赞↓':'时间↓';
  document.getElementById('dTitle').innerHTML=platLogo(plat==='全部'?'全部':plat,'drawer-logo')+' '+plat+' · '+(LVL[lv]||lv)+' 明细（'+rows.length+' 条）<button class="drawer-sort" onclick="toggleDrawerSort()">排序：'+sortLabel+'</button>';
  document.getElementById('dBody').innerHTML=rows.length?rows.map(drawerItemHTML).join(''):'<div class="empty">该平台该级别暂无条目</div>';
  document.getElementById('drawer').classList.add('show');
  document.getElementById('mask').classList.add('show');
}
function openRiskDrawer(url){
  const found=(window.__riskAll||[]).find(r=>r.source_url===url);
  if(!found){ return; }
  window.__curDrawerRows=[found];
  const plat=found.source||platOf(found.platform);
  const rawDt=found.publish_date||found.date||found.event_date||'—';
  const dt=String(rawDt).startsWith('编辑于') ? esc(rawDt) : ('发布于 '+esc(rawDt));
  const acc = found.account?('@'+esc(found.account)):'—';
  const chips=interactionChips(found.likes||'0', found.comments||'', found.collects||'', found.shares||'');
  const body=found.body?('<div class="rf-body" onclick="toggleBody(this)">'+esc(found.body)+'</div>'):'';
  const info=esc(acc)+' <span class="rf-sep">·</span> <span>'+esc(plat)+'</span> <span class="rf-sep">·</span> <span>'+dt+'</span>';
  const link=found.source_url?('<a class="rf-view" href="'+esc(found.source_url)+'" target="_blank" onclick="event.stopPropagation()">🔗 查看详情</a>'):sourceLink(found);
  const aiReason=found.ai_reason||'';
  const aiHtml=aiReason?('<div class="rf-ai"><span class="ai-label">AI 语义研判</span><span class="ai-reason">（'+esc(aiReason)+'）</span></div>'):'';
  const html=`<div class="drawer-item" style="display:flex;gap:10px;align-items:flex-start">${platLogo(plat,'drawer-logo').replace('plat-logo ','plat-logo rf-card-logo ').replace('title=\"'+esc(plat)+'\"','title=\"'+esc(plat)+'\" style=\"margin-top:2px;flex-shrink:0\"')}<div style="flex:1;min-width:0"><div class="d-title">${esc(found.text)}</div><div class="d-meta">${info}</div>${body}<div class="d-chips" style="margin-top:6px">${chips}</div>${aiHtml}${found.disposal?'<div class="risk-disposal"><b>处置：</b>'+esc(found.disposal)+'</div>':''}<div style="margin-top:6px">${link}</div></div></div>`;
  document.getElementById('dTitle').innerHTML='<span style="color:'+(LEVEL_COLOR[found.level]||'#C62828')+'">●</span> '+(LEVEL_LABEL[found.level]||found.level)+' 详情';
  document.getElementById('dBody').innerHTML=html;
  document.getElementById('drawer').classList.add('show');
  document.getElementById('mask').classList.add('show');
}
function openDrawer(lv){
  window.__curDrawer={kind:'level', lv:lv};
  const pool=window.__pool||{};
  let items=(pool[lv]||[]).slice();
  items=sortDrawerRows(items);
  window.__curDrawerRows=items;
  const L=LEVEL_LABEL[lv]||lv, C=LEVEL_COLOR[lv]||'#607D8B';
  const sortLabel=window.__drawerSort==='likes'?'点赞↓':'时间↓';
  document.getElementById('dTitle').innerHTML='<span style="color:'+C+'">●</span> '+L+' 明细（'+items.length+' 条）<button class="drawer-sort" onclick="toggleDrawerSort()">排序：'+sortLabel+'</button>';
  document.getElementById('dBody').innerHTML=items.length?items.map(drawerItemHTML).join(''):'<div class="empty">该级别暂无明细条目</div>';
  document.getElementById('drawer').classList.add('show');
  document.getElementById('mask').classList.add('show');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('mask').classList.remove('show');
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

/* 2026-08-22 v23 全局筛选器联动（置顶 sticky，控制舆情速览 + 声量图 + 风险清单） */
window.__CUR_PLAT='全部';
document.getElementById('filterBar').addEventListener('click', function(e){
  const b=e.target.closest('.global-btn'); if(!b) return;
  document.querySelectorAll('.global-btn').forEach(x=>x.classList.toggle('active',x===b));
  window.__CUR_PLAT=b.dataset.plat;
  renderPlatGridGlobal();
  refreshCharts();
  renderRisksGlobal();
  // 2026-08-23 修复：若排除归因 drawer 正打开，切换平台时同步刷新归因明细
  if(document.getElementById('drawer').classList.contains('show')){
    const m=document.getElementById('dTitle').textContent.match(/排除明细与归因[（(](\d{4}-\d{2}-\d{2})[）)]/);
    if(m) openExcludedDrawer(m[1], window.__CUR_PLAT||'全部');
  }
});
function renderPlatGridGlobal(){
  // 重新渲染舆情速览卡（按当前平台过滤计数）
  const D=SENTIMENT_DATA; const ev=CUR_DATE; const plat=window.__CUR_PLAT;
  const rows=(window.__platRows||[]).filter(r=>plat==='全部'||r.plat===plat);
  const LV={high_risk:{label:'高危',c:'#C62828'},light_negative:{label:'轻危',c:'#EF6C00'},neutral:{label:'中性',c:'#607D8B'},positive:{label:'正面',c:'#2E7D32'},doubt:{label:'存疑',c:'#7B1FA2'},excluded:{label:'排除',c:'#1565C0'}};
  const cnt={high_risk:0,light_negative:0,neutral:0,positive:0,doubt:0,excluded:0};
  rows.forEach(r=>{ const lv=normalizeLv(r.lv); if(cnt[lv]!==undefined) cnt[lv]++; });
  const ex=getExcludedByDate(D, ev, plat);
  cnt.excluded=ex.total;
  const grid=document.getElementById('platGrid'); if(!grid) return;
  grid.innerHTML=['high_risk','light_negative','neutral','positive','doubt','excluded'].map(k=>{
    const click = (k==='excluded') ? `openExcludedDrawer('${ev}', '${plat}')` : `openPlatDrawer(window.__CUR_PLAT||'全部','${k}')`;
    return `<div class="plat-card" style="--accent:${LV[k].c}" onclick="${click}">
      <span class="pill ${k}">${LV[k].label}</span>
      <div class="num">${cnt[k]}</div><div class="hint">查看明细 ▸</div></div>`;
  }).join('');
}
function renderRisksGlobal(){
  const D=SENTIMENT_DATA; const ev=CUR_DATE;
  const risks=pick(D.risks, ev).filter(r=>(r.brand||'美诺')==='美诺');
  const topics=pick(D.hot_topics, ev).filter(t=>(t.brand||'美诺')==='美诺');
  const sec=[...document.querySelectorAll('.module')].find(m=>m.querySelector('.risk-flow'));
  if(!sec) return;
  const node=document.createElement('div'); node.innerHTML=buildRisks(mergeRiskPool(risks, topics), ev, window.__riskPage||1);
  sec.replaceWith(node.firstElementChild);
}

setDate(curDateFromUrl());
</script>
